services:
  postgres:
    image: postgres:15-alpine
    container_name: miniapp_postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-stickerloot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-stickerloot_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: miniapp_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile
    container_name: miniapp_api
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-stickerloot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stickerloot_db}
      - REDIS_URL=redis://redis:6379/0
    expose:
      - "8000"
    depends_on:
      - postgres
      - redis

  bot:
    build:
      context: .
      dockerfile: docker/bot/Dockerfile
    container_name: miniapp_bot
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-stickerloot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stickerloot_db}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: miniapp_frontend
    restart: always
    expose:
      - "3002"
    depends_on:
      - api

  nginx:
    image: nginx:stable-alpine
    container_name: miniapp_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api
      - frontend

volumes:
  redis_data:
  postgres_data:
